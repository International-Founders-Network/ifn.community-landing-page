name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # npm 11 (bundled with Node 24) does not run dependency install scripts
      # unless allowlisted, so puppeteer's postinstall Chrome download is
      # skipped. Fetch Chrome explicitly, as scripts/netlify-build.sh does.
      - name: Install Chrome for puppeteer
        run: npx puppeteer browsers install chrome

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Test
        run: npm test
