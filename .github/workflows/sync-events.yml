name: Sync Events

on:
  schedule:
    - cron: "0 0 1,15 * *" # Run on the 1st and 15th of every month
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # npm 11 (bundled with Node 24) does not run dependency install scripts
      # unless allowlisted, so puppeteer's postinstall Chrome download is
      # skipped. Fetch Chrome explicitly, as scripts/netlify-build.sh does.
      - name: Install Chrome for puppeteer
        run: npx puppeteer browsers install chrome

      # update-events.js syncs both Luma calendars: IFN_ATX meetups into
      # src/data/events.json and IFN's Claude workshops into
      # src/data/workshops.json. A calendar that fails leaves its own file
      # untouched and the script still exits 0, so the other file can be
      # committed below. sync-all.js re-runs the meetup calendar only.
      - name: Run Scraper
        run: |
          node scripts/update-events.js
          node scripts/sync-meetup.js
          node scripts/sync-all.js

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain src/data/events.json src/data/workshops.json) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in events.json or workshops.json"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Commit and push if changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/events.json src/data/workshops.json
          git commit -m "chore: update events data [skip ci]"
          git push origin HEAD:main
